spring:
  application:
    name: sentinelops-ai

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: SentinelOps AI
    description: Explainable multi-agent incident response copilot
    version: 1.0.0
